name: Tests & CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-mock typer

    - name: Lint with pylint
      run: |
        pip install pylint
        pylint ubm_dots.py --disable=C0111,C0103 || true

    - name: Test with pytest
      run: |
        pytest tests/ -v --cov=. --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        fail_ci_if_error: false

  syntax:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Check syntax
      run: |
        python -m py_compile ubm_dots.py
        find tests -name "*.py" -exec python -m py_compile {} \;

    - name: Check imports
      run: |
        python -c "import typer, urllib.request, json, subprocess, shutil, pathlib; print('All imports OK')"

  docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Build Docker image
      run: docker build -t ubm-dots-test .

    - name: Run Docker tests
      run: |
        docker run ubm-dots-test bash -c "makepkg --version && echo 'PKGBUILD validation OK'"
