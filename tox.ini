[tox]
envlist = py314,py313,py312,lint,coverage
skip_missing_interpreters = True

[testenv]
deps =
    pytest>=7.0
    pytest-cov
    pytest-mock
commands =
    pytest {posargs}

[testenv:coverage]
commands =
    pytest --cov=. --cov-report=html --cov-report=term-missing tests/
    echo Coverage report generated in htmlcov/

[testenv:lint]
skip_install = True
deps =
    pylint
    black
    isort
commands =
    black --check ubm_dots.py tests/
    isort --check-only ubm_dots.py tests/
    pylint ubm_dots.py

[testenv:format]
skip_install = True
deps =
    black
    isort
commands =
    black ubm_dots.py tests/
    isort ubm_dots.py tests/
